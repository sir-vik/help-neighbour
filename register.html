<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Neighbourly</title>
    <link rel="stylesheet" href="style.css">
</head><body class="auth-body"><div class="auth-card">

    <div class="auth-header">
        <a href="index.html" class="logo">
            <span class="logo-icon">🤝</span> Neighbourly
        </a>

        <h2>Join Neighbourly</h2>
        <p>Get instant local help or offer your skills nearby</p>
    </div>

    <form class="auth-form" id="signupForm">

        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                placeholder="John Doe"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="name@example.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="helperSkills">Your Skill / Profession</label>
            <input
                type="text"
                id="helperSkills"
                placeholder="e.g., Carpenter, Plumber, Electrician"
                required
            >
        </div>

        <div class="form-group">
            <label for="role">I want to:</label>

            <select id="role" class="form-select" required>
                <option value="both">Both (Request & Offer Help)</option>
                <option value="requester">Request Help Only</option>
                <option value="helper">Become a Helper (Earn / Volunteer)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                minlength="6"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary btn-full"
            id="signupButton"
        >
            Create Account
        </button>

    </form>

    <div class="auth-footer">
        <p>
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>
    </div>

</div>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<script>

    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    var firebaseConfig = {
         apiKey: "AIzaSyAWWS_hRRX3XrbSHQgUqd6YYnVtAtfbO3w",
  authDomain: "help-neighbour-a468b.firebaseapp.com",
  databaseURL: "https://help-neighbour-a468b-default-rtdb.firebaseio.com",
  projectId: "help-neighbour-a468b",
  storageBucket: "help-neighbour-a468b.firebasestorage.app",
  messagingSenderId: "94455126492",
  appId: "1:94455126492:web:406cff5288ad7cff5ad719",
    };


    // Initialize Firebase ONCE
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }


    var auth = firebase.auth();
    var db = firebase.firestore();


    // ==========================================
    // SIGN UP
    // ==========================================

    document.addEventListener("DOMContentLoaded", function () {

        var signupForm = document.getElementById("signupForm");
        var signupButton = document.getElementById("signupButton");


        signupForm.addEventListener("submit", function (e) {

            e.preventDefault();


            var fullname = document.getElementById("fullname").value.trim();
            var email = document.getElementById("email").value.trim();
            var helperSkills = document.getElementById("helperSkills").value.trim();
            var role = document.getElementById("role").value;
            var password = document.getElementById("password").value;


            if (!fullname || !email || !helperSkills || !password) {
                alert("Please fill in all fields.");
                return;
            }


            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }


            // Prevent double clicking
            signupButton.disabled = true;
            signupButton.innerText = "Creating Account...";


            // Create Firebase account
            auth.createUserWithEmailAndPassword(email, password)

                .then(function (userCredential) {

                    var user = userCredential.user;


                    // Save user's name to Firebase Auth profile
                    return user.updateProfile({
                        displayName: fullname
                    }).then(function () {

                        // Save additional information in Firestore
                        return db.collection("users").doc(user.uid).set({

                            fullName: fullname,
                            email: email,
                            skill: helperSkills,
                            role: role,
                            userId: user.uid,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()

                        });

                    });

                })

                .then(function () {

                    alert("🎉 Account created successfully!");

                    // Redirect to homepage
                    window.location.href = "index.html";

                })

                .catch(function (error) {

                    console.error("Registration Error:", error);

                    signupButton.disabled = false;
                    signupButton.innerText = "Create Account";


                    if (error.code === "auth/email-already-in-use") {

                        alert("This email is already registered. Please sign in instead.");

                    } else if (error.code === "auth/invalid-email") {

                        alert("Please enter a valid email address.");

                    } else if (error.code === "auth/weak-password") {

                        alert("Password is too weak. Use at least 6 characters.");

                    } else {

                        alert("Registration failed: " + error.message);

                    }

                });

        });

    });

</script>

</body>
</html>
