<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Neighbourly</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

<div class="auth-card">

    <div class="auth-header">
        <a href="index.html" class="logo">
            <span class="logo-icon">🤝</span> Neighbourly
        </a>

        <h2>Join Neighbourly</h2>
        <p>Get local help or offer your skills to people nearby.</p>
    </div>

    <form class="auth-form" id="signupForm">

        <!-- FULL NAME -->
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                placeholder="John Doe"
                required
            >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="name@example.com"
                required
            >
        </div>

        <!-- PHONE -->
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="08012345678"
                required
            >
        </div>

        <!-- ROLE -->
        <div class="form-group">
            <label for="role">What do you want to do?</label>

            <select id="role" class="form-select" required>
                <option value="">Select an option</option>
                <option value="requester">I Need Help</option>
                <option value="helper">I Want to Offer My Skills</option>
                <option value="both">Both - Request & Offer Help</option>
            </select>
        </div>

        <!-- HELPER DETAILS -->
        <div id="helperSection" style="display:none;">

            <div class="form-group">
                <label for="helperSkills">Skill / Profession</label>

                <input
                    type="text"
                    id="helperSkills"
                    placeholder="e.g. Carpenter, Plumber, Electrician"
                >
            </div>

            <div class="form-group">
                <label for="experience">Experience Level</label>

                <select id="experience" class="form-select">
                    <option value="">Select experience</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Professional">Professional</option>
                    <option value="Expert">Expert</option>
                </select>
            </div>

            <div class="form-group">
                <label for="helperBio">Tell neighbours about your skill</label>

                <textarea
                    id="helperBio"
                    placeholder="Example: I am a professional carpenter with 5 years of experience..."
                    rows="4"
                    style="width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:6px;"
                ></textarea>
            </div>

        </div>

        <!-- PROFILE PHOTO -->
        <div class="form-group">
            <label for="profilePhoto">Profile Photo</label>

            <input
                type="file"
                id="profilePhoto"
                accept="image/*"
            >

            <small style="display:block; margin-top:5px; color:#64748b;">
                A clear photo helps neighbours recognize you.
            </small>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a strong password"
                minlength="6"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary btn-full"
            id="signupButton"
        >
            Create Account
        </button>

    </form>

    <div class="auth-footer">
        <p>
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>
    </div>

</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<script>

var firebaseConfig = {
     apiKey: "AIzaSyAWWS_hRRX3XrbSHQgUqd6YYnVtAtfbO3w",
  authDomain: "help-neighbour-a468b.firebaseapp.com",
  databaseURL: "https://help-neighbour-a468b-default-rtdb.firebaseio.com",
  projectId: "help-neighbour-a468b",
  storageBucket: "help-neighbour-a468b.firebasestorage.app",
  messagingSenderId: "94455126492",
  appId: "1:94455126492:web:406cff5288ad7cff5ad719",
    
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

var auth = firebase.auth();
var db = firebase.firestore();


// ==========================================
// SHOW / HIDE HELPER INFORMATION
// ==========================================

document.getElementById("role").addEventListener("change", function () {

    var role = this.value;
    var helperSection = document.getElementById("helperSection");

    if (role === "helper" || role === "both") {

        helperSection.style.display = "block";

        document.getElementById("helperSkills").required = true;
        document.getElementById("experience").required = true;
        document.getElementById("helperBio").required = true;

    } else {

        helperSection.style.display = "none";

        document.getElementById("helperSkills").required = false;
        document.getElementById("experience").required = false;
        document.getElementById("helperBio").required = false;

    }

});


// ==========================================
// SIGN UP
// ==========================================

document.getElementById("signupForm").addEventListener("submit", async function (e) {

    e.preventDefault();

    var signupButton = document.getElementById("signupButton");

    var fullname = document.getElementById("fullname").value.trim();
    var email = document.getElementById("email").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var role = document.getElementById("role").value;
    var password = document.getElementById("password").value;

    var helperSkills = document.getElementById("helperSkills").value.trim();
    var experience = document.getElementById("experience").value;
    var helperBio = document.getElementById("helperBio").value.trim();

   var photoFile = document.getElementById("profilePhoto").files[0];


if (!fullname || !email || !phone || !role || !password) {
    alert("Please complete all required fields.");
    return;
}


if ((role === "helper" || role === "both") &&
    (!helperSkills || !experience || !helperBio)) {

    alert("Please complete your helper information.");
    return;
}


if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
}


// UPLOAD PROFILE PHOTO TO CLOUDINARY
var photoUrl = "";

if (photoFile) {

    var formData = new FormData();

    formData.append("file", photoFile);

    formData.append("upload_preset", "neighbourly_profile");

    var cloudinaryResponse = await fetch(
        "https://api.cloudinary.com/v1_1/hzcut8p0/image/upload",
        {
            method: "POST",
            body: formData
        }
    );

    var cloudinaryData = await cloudinaryResponse.json();

    if (!cloudinaryResponse.ok) {
        console.error("Cloudinary Error:", cloudinaryData);
        alert("Profile photo upload failed. Please try again.");
        return;
    }

    photoUrl = cloudinaryData.secure_url;
} 
        alert("Please complete all required fields.");
        return;
    }


    if ((role === "helper" || role === "both") &&
        (!helperSkills || !experience || !helperBio)) {

        alert("Please complete your helper information.");
        return;
    }


    if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }


    signupButton.disabled = true;
    signupButton.innerText = "Creating Account...";


    try {

        // CREATE FIREBASE ACCOUNT
        var userCredential =
            await auth.createUserWithEmailAndPassword(email, password);

        var user = userCredential.user;


        // UPDATE FIREBASE PROFILE
        await user.updateProfile({
            displayName: fullname
        });


        // PROFILE DATA
        var userData = {

            fullName: fullname,
            email: email,
            phone: phone,

            role: role,

            skill: (role === "helper" || role === "both")
                ? helperSkills
                : "",

            experience: (role === "helper" || role === "both")
                ? experience
                : "",

            bio: (role === "helper" || role === "both")
                ? helperBio
                : "",

            profilePhoto: photoUrl"",

            userId: user.uid,

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        };


        // SAVE USER
        await db.collection("users")
            .doc(user.uid)
            .set(userData);


        alert("🎉 Welcome to Neighbourly! Your account has been created.");

        window.location.href = "index.html";


    } catch (error) {

        console.error("Registration Error:", error);

        signupButton.disabled = false;
        signupButton.innerText = "Create Account";


        if (error.code === "auth/email-already-in-use") {

            alert("This email is already registered. Please sign in instead.");

        } else if (error.code === "auth/invalid-email") {

            alert("Please enter a valid email address.");

        } else if (error.code === "auth/weak-password") {

            alert("Password is too weak. Use at least 6 characters.");

        } else {

            alert("Registration failed. Please try again.");

        }

    }

});

</script>

</body>
</html>
