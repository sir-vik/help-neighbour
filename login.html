<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Neighbourly</title>
    <link rel="stylesheet" href="style.css">
</head><body class="auth-body"><div class="auth-card">

    <div class="auth-header">
        <a href="index.html" class="logo">
            <span class="logo-icon">🤝</span> Neighbourly
        </a>

        <h2>Welcome Back</h2>
        <p>Log in to connect with your community</p>
    </div>

    <form class="auth-form">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="name@example.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary btn-full">
            Sign In
        </button>

    </form>

    <div class="auth-footer">
        <p>
            Don't have an account?
            <a href="register.html">Sign up</a>
        </p>
    </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

    // ================================
    // FIREBASE CONFIGURATION
    // ================================

    const firebaseConfig = {
          apiKey: "AIzaSyAWWS_hRRX3XrbSHQgUqd6YYnVtAtfbO3w",
  authDomain: "help-neighbour-a468b.firebaseapp.com",
  databaseURL: "https://help-neighbour-a468b-default-rtdb.firebaseio.com",
  projectId: "help-neighbour-a468b",
  storageBucket: "help-neighbour-a468b.firebasestorage.app",
  messagingSenderId: "94455126492",
  appId: "1:94455126492:web:4c412e743ae823915ad719",
  measurementId: "G-XJ3XQ7N616"
};


    // Initialize Firebase only once
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
    .catch(function(error) {
        console.error("Auth persistence error:", error);
    });


    // ================================
    // LOGIN
    // ================================

    document.addEventListener("DOMContentLoaded", function() {

        const authForm = document.querySelector(".auth-form");

        authForm.addEventListener("submit", async function(e) {

            e.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            try {

                const userCredential =
                    await auth.signInWithEmailAndPassword(
                        email,
                        password
                    );

                const user = userCredential.user;

                // Check user's role in Firestore
                const userDoc =
                    await db.collection("users")
                    .doc(user.uid)
                    .get();

                if (userDoc.exists) {

                    const userData = userDoc.data();

                    // ADMIN
                    if (userData.role === "admin") {

    alert("🛡️ Welcome back, Admin!");

    window.location.href = "index.html";

    return;
}
                }

                // NORMAL USER
                alert("👋 Welcome back!");

                window.location.href = "index.html";

            } catch (error) {

                console.error("Login Error:", error);

                alert("Login Error: " + error.message);
            }

        });

    });

</script>

</body>
