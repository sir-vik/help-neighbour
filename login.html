<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Sign in to Neighbourly and connect with your community."
  >

  <title>Sign In — Neighbourly</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-logo-mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      font-size: 25px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(15, 118, 110, .20);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 18px;
      padding: 5px;
    }

    .password-toggle:hover {
      color: #0f766e;
    }

    .login-status {
      display: none;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 4px;
    }

    .login-status.show {
      display: block;
    }

    .login-status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .login-status.success {
      background: #dcfce7;
      color: #166534;
    }

    .loading-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="auth-body">

  <main class="auth-card">

    <!-- HEADER -->
    <div class="auth-header">

      <div class="auth-logo-mark">
        N
      </div>

      <h1>Welcome back</h1>

      <p>
        Sign in to continue to your Neighbourly account.
      </p>

    </div>


    <!-- STATUS MESSAGE -->
    <div
      id="loginStatus"
      class="login-status"
      role="alert"
    ></div>


    <!-- LOGIN FORM -->
    <form
      id="loginForm"
      class="auth-form"
    >

      <!-- EMAIL -->
      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

      </div>


      <!-- PASSWORD -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            aria-label="Show password"
          >
            👁
          </button>

        </div>

      </div>


      <!-- FORGOT PASSWORD -->
      <div style="text-align:right;margin-top:-8px;">

        <a
          href="#"
          id="forgotPassword"
          style="font-size:13px;font-weight:700;"
        >
          Forgot password?
        </a>

      </div>


      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>


    <!-- FOOTER -->
    <div class="auth-footer">

      Don't have an account?

      <a href="register.html">
        Create one
      </a>

    </div>

  </main>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


  <script>

    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    var firebaseConfig = {

     apiKey: "AIzaSyAWWS_hRRX3XrbSHQgUqd6YYnVtAtfbO3w",
  authDomain: "help-neighbour-a468b.firebaseapp.com",
  databaseURL: "https://help-neighbour-a468b-default-rtdb.firebaseio.com",
  projectId: "help-neighbour-a468b",
  storageBucket: "help-neighbour-a468b.firebasestorage.app",
  messagingSenderId: "94455126492",
  appId: "1:94455126492:web:4c412e743ae823915ad719",
    };


    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }


    var auth =
      firebase.auth();

    var db =
      firebase.firestore();


    // ==========================================
    // ELEMENTS
    // ==========================================

    var loginForm =
      document.getElementById("loginForm");

    var emailInput =
      document.getElementById("email");

    var passwordInput =
      document.getElementById("password");

    var loginButton =
      document.getElementById("loginButton");

    var togglePassword =
      document.getElementById("togglePassword");

    var loginStatus =
      document.getElementById("loginStatus");

    var forgotPassword =
      document.getElementById("forgotPassword");


    // ==========================================
    // STATUS MESSAGE
    // ==========================================

    function showStatus(message, type) {

      loginStatus.textContent =
        message;

      loginStatus.className =
        "login-status show " +
        type;

    }


    function clearStatus() {

      loginStatus.textContent =
        "";

      loginStatus.className =
        "login-status";

    }


    // ==========================================
    // PASSWORD VISIBILITY
    // ==========================================

    togglePassword.addEventListener(
      "click",
      function () {

        var isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        togglePassword.textContent =
          isPassword
            ? "🙈"
            : "👁";

        togglePassword.setAttribute(
          "aria-label",
          isPassword
            ? "Hide password"
            : "Show password"
        );

      }
    );


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        clearStatus();


        var email =
          emailInput.value
            .trim()
            .toLowerCase();

        var password =
          passwordInput.value;


        if (!email || !password) {

          showStatus(
            "Please enter your email and password.",
            "error"
          );

          return;

        }


        // Loading state
        loginButton.disabled =
          true;

        loginButton.innerHTML =
          '<span class="loading-spinner"></span> Signing in...';


        try {

          // ====================================
          // SIGN IN
          // ====================================

          await auth
            .setPersistence(
              firebase.auth.Auth.Persistence.LOCAL
            );

          var credential =
            await auth.signInWithEmailAndPassword(
              email,
              password
            );

          var user =
            credential.user;


          // ====================================
          // GET USER PROFILE
          // ====================================

          var userDoc =
            await db.collection("users")
              .doc(user.uid)
              .get();


          var role =
            userDoc.exists
              ? userDoc.data().role
              : "requester";


          // ====================================
          // ADMIN SESSION
          // ====================================

          if (
            role === "admin" ||
            user.email ===
              "samuelchosen57@gmail.com"
          ) {

            localStorage.setItem(
              "isAdminLoggedIn",
              "true"
            );

            localStorage.setItem(
              "adminEmail",
              user.email
            );

          } else {

            localStorage.removeItem(
              "isAdminLoggedIn"
            );

            localStorage.removeItem(
              "adminEmail"
            );

          }


          showStatus(
            "Login successful. Welcome back!",
            "success"
          );


          // ====================================
          // REDIRECT
          // ====================================

          setTimeout(
            function () {

              window.location.href =
                "dashboard.html";

            },
            700
          );


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          var message =
            "Unable to sign in. Please try again.";


          if (
            error.code ===
            "auth/user-not-found" ||
            error.code ===
            "auth/wrong-password" ||
            error.code ===
            "auth/invalid-credential"
          ) {

            message =
              "Incorrect email or password.";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message =
              "Please enter a valid email address.";

          } else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message =
              "Too many failed attempts. Please try again later.";

          } else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            message =
              "Network error. Please check your internet connection.";

          }


          showStatus(
            message,
            "error"
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Sign In";

        }

      }
    );


    // ==========================================
    // FORGOT PASSWORD
    // ==========================================

    forgotPassword.addEventListener(
      "click",
      async function (event) {

        event.preventDefault();


        var email =
          emailInput.value
            .trim()
            .toLowerCase();


        if (!email) {

          showStatus(
            "Enter your email address first, then tap Forgot password.",
            "error"
          );

          emailInput.focus();

          return;

        }


        try {

          await auth
            .sendPasswordResetEmail(
              email
            );

          showStatus(
            "Password reset email sent. Check your inbox.",
            "success"
          );

        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );


          var message =
            "Unable to send password reset email.";


          if (
            error.code ===
            "auth/user-not-found"
          ) {

            message =
              "No account was found with this email.";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message =
              "Please enter a valid email address.";

          }


          showStatus(
            message,
            "error"
          );

        }

      }
    );

  </script>

</body>
</html>
